name: FlowPay Web and API CI

on:
  push:
    branches:
      - main
      - feat/api-foundation
      - feat/customer-banking-routes-no-sidebar
      - feat/to-bank-paystack-sandbox-payouts
      - feat/paystack-live-test-mode-support
    paths:
      - "apps/**"
      - ".github/workflows/**"
      - "README.md"
      - "IMPLEMENTATION_PLAN.md"
      - "docs/**"
  pull_request:
    branches:
      - main
    paths:
      - "apps/**"
      - ".github/workflows/**"
      - "README.md"
      - "IMPLEMENTATION_PLAN.md"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flowpay-web-ci-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  verify-api-and-web:
    name: Verify API and build web app only
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            apps/api/package-lock.json
            apps/web/package-lock.json

      - name: Install API dependencies
        run: npm install --include=dev --prefix apps/api

      - name: Audit API dependencies
        shell: bash
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/flowpay-api-npm-audit.json"
          npm audit --prefix apps/api --json > "$report" || true
          node --input-type=module -e '
            import fs from "node:fs";
            const report = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/flowpay-api-npm-audit.json", "utf8"));
            const vulnerabilities = Object.entries(report.vulnerabilities ?? {}).map(([name, item]) => ({
              name,
              severity: item.severity,
              direct: item.isDirect,
              range: item.range,
              fixAvailable: item.fixAvailable
            }));
            const totals = report.metadata?.vulnerabilities ?? {};
            console.log(JSON.stringify({ metadata: totals, vulnerabilities }, null, 2));
            if ((totals.total ?? vulnerabilities.length) !== 0) {
              console.error("FlowPay API dependency audit must be clean before release.");
              process.exitCode = 1;
            }
          '

      - name: Upload API dependency audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flowpay-api-npm-audit
          path: ${{ runner.temp }}/flowpay-api-npm-audit.json
          if-no-files-found: warn
          retention-days: 7

      - name: Type-check API
        run: npm run typecheck --prefix apps/api

      - name: Test Neon and FlowPay passkey JWT verification
        run: npm run test:passkey-tokens --prefix apps/api

      - name: Test Smile ID face and liveness result decisions
        run: npm run test:face-verification --prefix apps/api

      - name: Test Flutterwave webhook verification and replay protection
        run: npm run test:flutterwave-webhook --prefix apps/api

      - name: Test Flutterwave sandbox checkout persistence and isolation
        run: npm run test:flutterwave-checkout --prefix apps/api

      - name: Test Paystack webhook verification and replay protection
        run: npm run test:paystack-webhook --prefix apps/api

      - name: Test NGN 50,000 Paystack sandbox deposit checkout
        run: npm run test:paystack-checkout-50000 --prefix apps/api

      - name: Test authenticated Paystack deposit callback recovery
        run: npm run test:paystack-status --prefix apps/api

      - name: Test fail-closed Paystack live and test mode selection
        run: npm run test:paystack-mode --prefix apps/api

      - name: Test VTpass bill payment validation and status handling
        run: npm run test:vtpass-bills --prefix apps/api

      - name: Test Flutterwave utility bill safeguards and provider status
        run: npm run test:flutterwave-utility-bills --prefix apps/api

      - name: Test signed Storyblok Visual Editor preview access
        run: npm run test:storyblok-preview --prefix apps/api

      - name: Test Paystack Nigerian bank directory and account resolution
        run: npm run test:paystack-bank-lookup --prefix apps/api

      - name: Test Paystack sandbox bank payout, idempotency and ledger safeguards
        run: npm run test:paystack-bank-transfers --prefix apps/api

      - name: Test Paystack dedicated bank account consent and assignment
        run: npm run test:paystack-dedicated-accounts --prefix apps/api

      - name: Test Paystack dedicated NUBAN customer deposit settlement
        run: npm run test:paystack-dva-settlement --prefix apps/api

      - name: Test FlowPay internal wallet transfers and ledger safeguards
        run: npm run test:flowpay-transfers --prefix apps/api

      - name: Test Neon-verified phone onboarding and permanent FlowPay ID assignment
        run: npm run test:customer-bootstrap-phone --prefix apps/api

      - name: Test Nigerian phone recipient alias normalization
        run: npm run test:customer-phone-aliases --prefix apps/api

      - name: Test signed Neon Auth SMS and email OTP delivery
        run: npm run test:neon-auth-otp-webhook --prefix apps/api

      - name: Test private customer transfer notifications and read controls
        run: npm run test:customer-notifications --prefix apps/api

      - name: Test authenticated FlowPay BALMZ AI customer assistant
        run: npm run test:customer-ai --prefix apps/api

      - name: Test private deposit receipt upload and review controls
        run: npm run test:deposit-receipts --prefix apps/api

      - name: Smoke-test API health and safe readiness behavior
        shell: bash
        run: |
          set -euo pipefail
          npm run start --prefix apps/api > "$RUNNER_TEMP/flowpay-api.log" 2>&1 &
          api_pid=$!
          cleanup() {
            kill "$api_pid" 2>/dev/null || true
            wait "$api_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          ready=0
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:3000/health > "$RUNNER_TEMP/flowpay-health.json"; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat "$RUNNER_TEMP/flowpay-api.log"
            echo "API health endpoint did not become available" >&2
            exit 1
          fi
          node --input-type=module -e '
            import fs from "node:fs";
            const health = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/flowpay-health.json", "utf8"));
            if (health.service !== "flowpay-api" || health.status !== "ok") {
              throw new Error("Unexpected /health response: " + JSON.stringify(health));
            }
          '
          ready_status="$(curl --silent --output "$RUNNER_TEMP/flowpay-ready.json" --write-out "%{http_code}" http://127.0.0.1:3000/ready)"
          if [ "$ready_status" != "503" ]; then
            cat "$RUNNER_TEMP/flowpay-ready.json"
            echo "Expected /ready to return 503 when DATABASE_URL is not configured; got $ready_status" >&2
            exit 1
          fi
          node --input-type=module -e '
            import fs from "node:fs";
            const readiness = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/flowpay-ready.json", "utf8"));
            const payments = readiness.payments ?? {};
            const paystack = payments.paystack ?? {};
            const flutterwave = payments.flutterwave ?? {};
            if (readiness.database !== "not_configured" ||
                paystack.bankDirectory !== false ||
                paystack.bankTransfers !== false ||
                paystack.deposits !== false ||
                flutterwave.deposits !== false) {
              throw new Error("Unsafe or unexpected /ready response: " + JSON.stringify(readiness));
            }
          '

      - name: Install web dependencies with patched Better Auth versions
        run: npm install --prefix apps/web

      - name: Upload regenerated web package lock
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flowpay-web-package-lock
          path: apps/web/package-lock.json
          if-no-files-found: warn
          retention-days: 7

      - name: Verify installed Better Auth package family
        run: npm ls --prefix apps/web better-auth @better-auth/core @better-auth/oauth-provider @better-auth/passkey @better-auth/drizzle-adapter --all

      - name: Capture production web dependency audit report
        id: web-audit
        shell: bash
        run: |
          set -uo pipefail
          report="$RUNNER_TEMP/flowpay-web-npm-audit.json"
          npm audit --omit=dev --prefix apps/web --json > "$report" || true
          node --input-type=module -e '
            import fs from "node:fs";
            const report = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/flowpay-web-npm-audit.json", "utf8"));
            const vulnerabilities = Object.entries(report.vulnerabilities ?? {}).map(([name, item]) => ({
              name,
              severity: item.severity,
              direct: item.isDirect,
              range: item.range,
              fixAvailable: item.fixAvailable
            }));
            const totals = report.metadata?.vulnerabilities ?? {};
            console.log(JSON.stringify({ metadata: totals, vulnerabilities }, null, 2));
            if ((totals.total ?? vulnerabilities.length) !== 0) {
              console.error("FlowPay production web dependency audit must be clean before release.");
              process.exitCode = 1;
            }
          '

      - name: Upload production web dependency audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flowpay-web-production-npm-audit
          path: ${{ runner.temp }}/flowpay-web-npm-audit.json
          if-no-files-found: warn
          retention-days: 7

      - name: Report full web dependency advisories
        shell: bash
        run: |
          set -uo pipefail
          report="$RUNNER_TEMP/flowpay-web-full-npm-audit.json"
          npm audit --prefix apps/web --json > "$report" || true
          node --input-type=module -e '
            import fs from "node:fs";
            const report = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/flowpay-web-full-npm-audit.json", "utf8"));
            const advisories = Object.entries(report.vulnerabilities ?? {}).map(([name, item]) => ({
              name, severity: item.severity, direct: item.isDirect,
              range: item.range, fixAvailable: item.fixAvailable,
              via: (item.via ?? []).filter(value => typeof value === "object").map(value => ({
                title: value.title, url: value.url, range: value.range
              }))
            }));
            console.log(JSON.stringify({
              scope: "complete dependency tree, including development-only build tools",
              metadata: report.metadata?.vulnerabilities ?? {},
              advisories
            }, null, 2));
          '

      - name: Upload full web dependency audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flowpay-web-full-npm-audit
          path: ${{ runner.temp }}/flowpay-web-full-npm-audit.json
          if-no-files-found: warn
          retention-days: 7

      - name: Build web app
        run: npm run build --prefix apps/web
        env:
          VITE_API_BASE_URL: https://flowpay-backend-qz79.onrender.com
          VITE_NEON_AUTH_URL: https://ep-quiet-grass-zabt9514.neonauth.c-2.eu-west-2.aws.neon.tech/flowpay/auth

      - name: Smoke-test deployed FlowPay API, database and bank-name service
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          api="https://flowpay-backend-qz79.onrender.com"
          web="https://flowpay-web-jx7i.onrender.com"
          ready_file="$RUNNER_TEMP/flowpay-live-ready.json"
          ready_status="000"
          for attempt in $(seq 1 24); do
            ready_status="$(curl --silent --show-error --max-time 12 --output "$ready_file" --write-out "%{http_code}" "$api/ready" || true)"
            if [ "$ready_status" = "200" ]; then
              break
            fi
            echo "Waiting for the live API deployment (attempt $attempt/24; HTTP $ready_status)..."
            sleep 10
          done
          if [ "$ready_status" != "200" ]; then
            cat "$ready_file" 2>/dev/null || true
            echo "The deployed FlowPay API did not become ready." >&2
            exit 1
          fi
          node --input-type=module -e '
            import fs from "node:fs";
            const ready = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/flowpay-live-ready.json", "utf8"));
            const paystack = ready.payments?.paystack ?? {};
            const vtpass = ready.payments?.vtpass ?? {};
            const report = {
              api: ready.service,
              status: ready.status,
              database: ready.database,
              database_name: ready.database_name,
              paystack_environment: paystack.environment ?? null,
              bank_directory: paystack.bankDirectory === true,
              beneficiary_verification: paystack.beneficiaryVerification === true,
              bank_transfers: paystack.bankTransfers === true,
              bank_transfer_gate: paystack.bankTransferGate ?? "unknown",
              vtpass_environment: vtpass.environment ?? null,
              vtpass_credentials_configured: vtpass.credentialsConfigured === true,
              vtpass_bill_api_ready: vtpass.billApiReady === true,
              vtpass_live_purchases_enabled: vtpass.livePurchasesEnabled === true
            };
            console.log(JSON.stringify(report, null, 2));
            if (ready.service !== "flowpay-api" || ready.status !== "ready" ||
                ready.database !== "connected" ||
                paystack.bankDirectory !== true ||
                paystack.beneficiaryVerification !== true) {
              throw new Error("Live API, database, Paystack bank directory or beneficiary-name verification is not ready.");
            }
            if (typeof vtpass.credentialsConfigured !== "boolean" ||
                typeof vtpass.billApiReady !== "boolean" ||
                typeof vtpass.livePurchasesEnabled !== "boolean") {
              throw new Error("VTpass capability readiness fields are missing from the live API response.");
            }
            if (vtpass.credentialsConfigured !== true) {
              console.warn("VTpass credentials are not configured; airtime/data/electricity purchases are not yet enabled.");
            } else if (vtpass.billApiReady !== true) {
              console.warn("VTpass credentials exist, but the bill-payment database or clearing-account capability is not ready.");
            }
            if (paystack.bankTransfers !== true) {
              console.warn("Bank-name verification is ready, but bank payout submission remains behind its independent approval/feature gate.");
            }
          '
          web_status="$(curl --silent --show-error --max-time 12 --output "$RUNNER_TEMP/flowpay-live-login.html" --write-out "%{http_code}" "$web/login" || true)"
          if [ "$web_status" != "200" ]; then
            echo "The deployed FlowPay login page returned HTTP $web_status." >&2
            exit 1
          fi
          echo "Live FlowPay API readiness and frontend login-page smoke tests passed."
