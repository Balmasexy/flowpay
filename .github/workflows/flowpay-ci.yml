name: FlowPay Web and API CI

on:
  push:
    branches:
      - main
      - feat/api-foundation
      - feat/customer-banking-routes-no-sidebar
    paths:
      - "apps/**"
      - ".github/workflows/**"
      - "README.md"
      - "IMPLEMENTATION_PLAN.md"
      - "docs/**"
  pull_request:
    branches:
      - main
    paths:
      - "apps/**"
      - ".github/workflows/**"
      - "README.md"
      - "IMPLEMENTATION_PLAN.md"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flowpay-web-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-api-and-web:
    name: Verify API and build web app only
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            apps/api/package-lock.json
            apps/web/package-lock.json

      - name: Install API dependencies
        run: npm ci --prefix apps/api

      - name: Type-check API
        run: npm run typecheck --prefix apps/api

      - name: Test Smile ID face and liveness result decisions
        run: npm run test:face-verification --prefix apps/api

      - name: Test Flutterwave webhook verification and replay protection
        run: npm run test:flutterwave-webhook --prefix apps/api

      - name: Test Paystack webhook verification and replay protection
        run: npm run test:paystack-webhook --prefix apps/api

      - name: Test Paystack Nigerian bank directory and account resolution
        run: npm run test:paystack-bank-lookup --prefix apps/api

      - name: Test FlowPay internal wallet transfers and ledger safeguards
        run: npm run test:flowpay-transfers --prefix apps/api

      - name: Smoke-test API health and safe readiness behavior
        shell: bash
        run: |
          set -euo pipefail
          npm run start --prefix apps/api > "$RUNNER_TEMP/flowpay-api.log" 2>&1 &
          api_pid=$!
          cleanup() {
            kill "$api_pid" 2>/dev/null || true
            wait "$api_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          ready=0
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:3000/health > "$RUNNER_TEMP/flowpay-health.json"; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat "$RUNNER_TEMP/flowpay-api.log"
            echo "API health endpoint did not become available" >&2
            exit 1
          fi
          node --input-type=module -e '
            import fs from "node:fs";
            const health = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/flowpay-health.json", "utf8"));
            if (health.service !== "flowpay-api" || health.status !== "ok") {
              throw new Error("Unexpected /health response: " + JSON.stringify(health));
            }
          '
          ready_status="$(curl --silent --output "$RUNNER_TEMP/flowpay-ready.json" --write-out "%{http_code}" http://127.0.0.1:3000/ready)"
          if [ "$ready_status" != "503" ]; then
            cat "$RUNNER_TEMP/flowpay-ready.json"
            echo "Expected /ready to return 503 when DATABASE_URL is not configured; got $ready_status" >&2
            exit 1
          fi
          node --input-type=module -e '
            import fs from "node:fs";
            const readiness = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/flowpay-ready.json", "utf8"));
            if (readiness.database !== "not_configured" || readiness.payments !== "disabled") {
              throw new Error("Unsafe or unexpected /ready response: " + JSON.stringify(readiness));
            }
          '

      - name: Install web dependencies
        run: npm ci --prefix apps/web

      - name: Capture web dependency audit report
        id: web-audit
        shell: bash
        run: |
          set -uo pipefail
          report="$RUNNER_TEMP/flowpay-web-npm-audit.json"
          npm audit --prefix apps/web --json > "$report" || true
          node --input-type=module -e '
            import fs from "node:fs";
            const report = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/flowpay-web-npm-audit.json", "utf8"));
            const vulnerabilities = Object.entries(report.vulnerabilities ?? {}).map(([name, item]) => ({
              name,
              severity: item.severity,
              direct: item.isDirect,
              range: item.range,
              fixAvailable: item.fixAvailable
            }));
            console.log(JSON.stringify({ metadata: report.metadata?.vulnerabilities ?? null, vulnerabilities }, null, 2));
          '

      - name: Upload web dependency audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flowpay-web-npm-audit
          path: ${{ runner.temp }}/flowpay-web-npm-audit.json
          if-no-files-found: warn
          retention-days: 7

      - name: Build web app
        run: npm run build --prefix apps/web
        env:
          VITE_API_BASE_URL: https://flowpay-backend-qz79.onrender.com
