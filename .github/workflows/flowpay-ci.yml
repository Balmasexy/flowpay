name: FlowPay CI and Android APK

on:
  push:
    branches:
      - feat/api-foundation
    paths:
      - "apps/**"
      - ".github/workflows/**"
      - "README.md"
      - "IMPLEMENTATION_PLAN.md"
  pull_request:
    branches:
      - feat/api-foundation
    paths:
      - "apps/**"
      - ".github/workflows/**"
      - "README.md"
      - "IMPLEMENTATION_PLAN.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flowpay-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-build-android:
    name: Verify API and web; build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            apps/api/package-lock.json
            apps/web/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Verify runner Android SDK and install required packages
        shell: bash
        run: |
          set -euo pipefail
          : "${ANDROID_HOME:?GitHub runner Android SDK path is missing}"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null
          set -o pipefail
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Install API dependencies
        run: npm ci --prefix apps/api

      - name: Type-check API
        run: npm run typecheck --prefix apps/api

      - name: Smoke-test API health and safe readiness behavior
        shell: bash
        run: |
          set -euo pipefail
          npm run start --prefix apps/api > "$RUNNER_TEMP/flowpay-api.log" 2>&1 &
          api_pid=$!
          cleanup() {
            kill "$api_pid" 2>/dev/null || true
            wait "$api_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          ready=0
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:3000/health > "$RUNNER_TEMP/flowpay-health.json"; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat "$RUNNER_TEMP/flowpay-api.log"
            echo "API health endpoint did not become available" >&2
            exit 1
          fi
          node --input-type=module -e '
            import fs from "node:fs";
            const health = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/flowpay-health.json", "utf8"));
            if (health.service !== "flowpay-api" || health.status !== "ok") {
              throw new Error("Unexpected /health response: " + JSON.stringify(health));
            }
          '
          ready_status="$(curl --silent --output "$RUNNER_TEMP/flowpay-ready.json" --write-out "%{http_code}" http://127.0.0.1:3000/ready)"
          if [ "$ready_status" != "503" ]; then
            cat "$RUNNER_TEMP/flowpay-ready.json"
            echo "Expected /ready to return 503 when DATABASE_URL is not configured; got $ready_status" >&2
            exit 1
          fi
          node --input-type=module -e '
            import fs from "node:fs";
            const readiness = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/flowpay-ready.json", "utf8"));
            if (readiness.database !== "not_configured" || readiness.payments !== "disabled") {
              throw new Error("Unsafe or unexpected /ready response: " + JSON.stringify(readiness));
            }
          '

      - name: Install web dependencies
        run: npm ci --prefix apps/web

      - name: Build web app
        run: npm run build --prefix apps/web
        env:
          VITE_API_BASE_URL: https://flowpay-backend-qz79.onrender.com
          VITE_NEON_AUTH_URL: https://ep-quiet-grass-zabt9514.neonauth.c-2.eu-west-2.aws.neon.tech/flowpay/auth

      - name: Install pinned Capacitor tooling without changing the lockfile
        run: npm install --prefix apps/web --no-save --package-lock=false @capacitor/core@8.5.3 @capacitor/android@8.5.3 @capacitor/cli@8.5.3

      - name: Generate Android project
        working-directory: apps/web
        run: npx cap add android

      - name: Sync web assets to Android
        working-directory: apps/web
        run: npx cap sync android

      - name: Configure persistent FlowPay Android signing
        working-directory: apps/web/android
        env:
          FLOWPAY_KEYSTORE_BASE64: ${{ secrets.FLOWPAY_KEYSTORE_BASE64 }}
          FLOWPAY_KEYSTORE_PASSWORD: ${{ secrets.FLOWPAY_KEYSTORE_PASSWORD }}
          FLOWPAY_KEY_ALIAS: ${{ secrets.FLOWPAY_KEY_ALIAS }}
          FLOWPAY_KEY_PASSWORD: ${{ secrets.FLOWPAY_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$FLOWPAY_KEYSTORE_BASE64" || { echo "Missing FLOWPAY_KEYSTORE_BASE64 GitHub secret" >&2; exit 1; }
          test -n "$FLOWPAY_KEYSTORE_PASSWORD" || { echo "Missing FLOWPAY_KEYSTORE_PASSWORD GitHub secret" >&2; exit 1; }
          test -n "$FLOWPAY_KEY_ALIAS" || { echo "Missing FLOWPAY_KEY_ALIAS GitHub secret" >&2; exit 1; }
          test -n "$FLOWPAY_KEY_PASSWORD" || { echo "Missing FLOWPAY_KEY_PASSWORD GitHub secret" >&2; exit 1; }
          KEYSTORE_PATH="$RUNNER_TEMP/flowpay-upload.jks"
          printf '%s' "$FLOWPAY_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          keytool -list -keystore "$KEYSTORE_PATH" -storepass "$FLOWPAY_KEYSTORE_PASSWORD" -alias "$FLOWPAY_KEY_ALIAS" >/dev/null
          echo "FLOWPAY_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("app/build.gradle")
          s = p.read_text()
          android = re.search(r"(?m)^(\s*)android\s*\{", s)
          if not android:
              raise SystemExit("Generated app/build.gradle has no android { block")
          s = re.sub(r"(?m)^\s*compileSdk(?:Version)?\s+.*$", "    compileSdk 36", s)
          if not re.search(r"(?m)^\s*compileSdk\s+36\s*$", s):
              pos = android.end()
              s = s[:pos] + "\n    compileSdk 36" + s[pos:]
          if not re.search(r"(?m)^\s*compileSdk\s+36\s*$", s):
              raise SystemExit("compileSdk 36 was not configured")
          if "signingConfigs {" not in s:
              s = s.replace("android {", """android {
              signingConfigs {
                  flowpayStable {
                      storeFile file(System.getenv("FLOWPAY_KEYSTORE_PATH"))
                      storePassword System.getenv("FLOWPAY_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("FLOWPAY_KEY_ALIAS")
                      keyPassword System.getenv("FLOWPAY_KEY_PASSWORD")
                  }
              }
          """, 1)
          if "signingConfig signingConfigs.flowpayStable" not in s:
              s = re.sub(r"buildTypes\s*\{", "buildTypes {\n        debug { signingConfig signingConfigs.flowpayStable }", s, count=1)
          if "signingConfig signingConfigs.flowpayStable" not in s:
              raise SystemExit("Could not attach stable signing config to debug build")
          s, count = re.subn(r"versionCode\s+\d+", 'versionCode 10000 + Integer.parseInt(System.getenv("GITHUB_RUN_NUMBER") ?: "1")', s, count=1)
          if count != 1:
              raise SystemExit("Could not set monotonically increasing Android versionCode")
          p.write_text(s)
          PY
          grep -nE 'flowpayStable|versionCode' app/build.gradle

      - name: Build debug APK
        working-directory: apps/web/android
        env:
          FLOWPAY_KEYSTORE_PATH: ${{ runner.temp }}/flowpay-upload.jks
          FLOWPAY_KEYSTORE_PASSWORD: ${{ secrets.FLOWPAY_KEYSTORE_PASSWORD }}
          FLOWPAY_KEY_ALIAS: ${{ secrets.FLOWPAY_KEY_ALIAS }}
          FLOWPAY_KEY_PASSWORD: ${{ secrets.FLOWPAY_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -s "$FLOWPAY_KEYSTORE_PATH"
          grep -qE '^\s*compileSdk 36\s*
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: flowpay-debug-apk
          path: apps/web/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
 app/build.gradle
          ./gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: flowpay-debug-apk
          path: apps/web/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
