name: FlowPay Android APK and AAB

on:
  push:
    branches: [main]
    paths:
      - "apps/android/**"
      - ".github/workflows/android-release.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/android/**"
      - ".github/workflows/android-release.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flowpay-android-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Build and verify FlowPay APK and AAB
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout FlowPay
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK platform and build tools
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.9.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.9.1"

      - name: Configure optional release signing
        id: signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.FLOWPAY_ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.FLOWPAY_ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.FLOWPAY_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.FLOWPAY_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          values=("$KEYSTORE_BASE64" "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD")
          present=0
          for value in "${values[@]}"; do
            if [[ -n "$value" ]]; then present=$((present + 1)); fi
          done
          if [[ "$present" -eq 0 ]]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "FLOWPAY_ANDROID_KEYSTORE_PATH=" >> "$GITHUB_ENV"
            echo "Release signing secrets are not configured; debug APK will be signed with the Android debug key and release APK/AAB will be unsigned."
            exit 0
          fi
          if [[ "$present" -ne 4 ]]; then
            echo "::error::Configure all four FLOWPAY_ANDROID_* GitHub Actions secrets together."
            exit 1
          fi
          keystore="$RUNNER_TEMP/flowpay-upload-key.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
          chmod 600 "$keystore"
          keytool -list -keystore "$keystore" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          {
            echo "FLOWPAY_ANDROID_KEYSTORE_PATH=$keystore"
            echo "FLOWPAY_ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "FLOWPAY_ANDROID_KEY_ALIAS=$KEY_ALIAS"
            echo "FLOWPAY_ANDROID_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"
          echo "signed=true" >> "$GITHUB_OUTPUT"
          echo "Release upload keystore validated."

      - name: Build debug APK, release APK, and release AAB
        working-directory: apps/android
        run: gradle --no-daemon --stacktrace :app:assembleDebug :app:assembleRelease :app:bundleRelease

      - name: Verify generated Android packages
        id: verify
        shell: bash
        env:
          RELEASE_SIGNED: ${{ steps.signing.outputs.signed }}
        run: |
          set -euo pipefail
          debug_apk="apps/android/app/build/outputs/apk/debug/app-debug.apk"
          release_apk="apps/android/app/build/outputs/apk/release/app-release.apk"
          unsigned_release_apk="apps/android/app/build/outputs/apk/release/app-release-unsigned.apk"
          release_aab="apps/android/app/build/outputs/bundle/release/app-release.aab"

          test -s "$debug_apk"
          test -s "$release_aab"
          apksigner verify --verbose "$debug_apk"

          if [[ "$RELEASE_SIGNED" == "true" ]]; then
            test -s "$release_apk"
            apksigner verify --verbose "$release_apk"
            jarsigner -verify "$release_aab" >/dev/null
            echo "APK and AAB release signatures verified." >> "$GITHUB_STEP_SUMMARY"
            echo "release_signed=true" >> "$GITHUB_OUTPUT"
          else
            test -s "$unsigned_release_apk"
            echo "Debug APK is installable. Release APK/AAB are unsigned because no private upload keystore was configured." >> "$GITHUB_STEP_SUMMARY"
            echo "release_signed=false" >> "$GITHUB_OUTPUT"
          fi

          {
            echo "## FlowPay Android build"
            echo ""
            echo "- Debug APK: `$debug_apk` (debug-signed)"
            if [[ "$RELEASE_SIGNED" == "true" ]]; then
              echo "- Release APK: `$release_apk` (release-signed)"
              echo "- Release AAB: `$release_aab` (release-signed)"
            else
              echo "- Release APK: `$unsigned_release_apk` (unsigned)"
              echo "- Release AAB: `$release_aab` (unsigned; not ready for Play upload)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK and AAB artifacts
        uses: actions/upload-artifact@v4
        with:
          name: flowpay-android-${{ github.sha }}
          path: |
            apps/android/app/build/outputs/apk/**/*.apk
            apps/android/app/build/outputs/bundle/**/*.aab
          if-no-files-found: error
          retention-days: 30
